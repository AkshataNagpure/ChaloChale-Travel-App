<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
    <script src="https://kit.fontawesome.com/fbf5a80417.js" crossorigin="anonymous"></script>

    <div class="container">
        <div class="row">
            <div class="col-md-12">


                <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

                    <div class="container">

                        <a class="navbar-brand fw-bold" href="#">
                            <i class="fa-solid fa-plane-departure"></i> ChaloChale
                        </a>

                        <!-- Hamburger -->
                        <button class="navbar-toggler"
                            type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#menu"
                            aria-controls="menu"
                            aria-expanded="false"
                            aria-label="Toggle navigation">

                            <span class="navbar-toggler-icon"></span>

                        </button>

                        <!-- Navigation Menu -->
                        <div class="collapse navbar-collapse" id="menu">

                            <ul class="navbar-nav ms-auto">

                                <li class="nav-item">
                                    <a class="nav-link active" href="index.html">Home</a>
                                </li>

                                <li class="nav-item">
                                    <a class="nav-link" href="destinations.html">Destinations</a>
                                </li>

                                <li class="nav-item">
                                    <a class="nav-link" href="packages.html">Packages</a>
                                </li>

                                <li class="nav-item">
                                    <a class="nav-link" href="booking.html">Booking</a>
                                </li>

                                <li class="nav-item">
                                    <a class="nav-link" href="contact.html">Contact</a>
                                </li>

                                <li class="nav-item">
                                    <a class="nav-link" href="about.html">About</a>
                                </li>

                            </ul>

                            <a href="signup.html" class="btn btn-warning ms-lg-3">
                                Signup
                            </a>

                            <a href="login.html" class="btn btn-warning ms-lg-3">
                                Login
                            </a>

                        </div>

                    </div>

                </nav>

            </div>

            <!-- Contact Form -->
            <section class="py-5">
                <div class="container">
                    <div class="row justify-content-center">

                        <div class="col-12 col-md-10 col-lg-8">
                            <div class="card shadow-lg p-4 rounded-4">

                                <h3 class="fw-bold mb-4 text-center">Contact Us</h3>

                                <form>

                                    <div class="row">

                                        <div class="col-12 col-md-6 mb-3">
                                            <label class="form-label">Full Name</label>
                                            <input type="text" class="form-control" placeholder="Enter your name">
                                        </div>

                                        <div class="col-12 col-md-6 mb-3">
                                            <label class="form-label">Email</label>
                                            <input type="email" class="form-control" placeholder="Enter your email">
                                        </div>

                                    </div>

                                    <div class="row">

                                        <div class="col-12 col-md-6 mb-3">
                                            <label class="form-label">Phone Number</label>
                                            <input type="tel" class="form-control" placeholder="Enter your phone number">
                                        </div>

                                        <div class="col-12 col-md-6 mb-3">
                                            <label class="form-label">Subject</label>
                                            <input type="text" class="form-control" placeholder="Enter subject">
                                        </div>

                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">Message</label>
                                        <textarea class="form-control" rows="4" placeholder="Enter your message"></textarea>
                                    </div>

                                    <button type="submit" class="btn btn-success w-100">
                                        Send Message
                                    </button>

                                </form>

                            </div>
                        </div>

                    </div>
                </div>
            </section>

            

            <footer class="bg-dark text-white text-center py-3">
            <p class="mb-0">&copy; 2026 ChaloChale Travel App | Designed with Bootstrap</p>
            </footer>
        </div>
            
</body>
</html>
